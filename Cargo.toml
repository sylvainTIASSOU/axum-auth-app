[package]
name = "axum-auth-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "auth"
path = "src/bin/main.rs"

[lib]
name = "auth"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
color-eyre = "0.6.5"
config = { version = "0.15.27", features = ["yaml"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde", "tracing", "json"] }
