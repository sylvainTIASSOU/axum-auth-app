[package]
name = "axum-auth-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "auth"
path = "src/bin/main.rs"

[lib]
name = "auth"
path = "src/lib.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.5"
config = { version = "0.15.27", features = ["yaml"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
redis = { version = "1.7.1", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde", "tracing", "json"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
